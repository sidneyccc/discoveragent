name: Source Refresh Cron

on:
  schedule:
    # Daytime-heavy cadence (US Pacific approximation): every 3 hours during active hours.
    # UTC: 16,19,22,01,04,07  -> PT: 08,11,14,17,20,23
    - cron: "0 1,4,7,16,19,22 * * *"
    # Overnight cadence (US Pacific approximation): every 4 hours overnight.
    # UTC: 08,12  -> PT: 00,04
    - cron: "0 8,12 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger source refresh endpoint
        env:
          CRON_ENDPOINT: ${{ secrets.CRON_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          endpoint="${CRON_ENDPOINT:-https://discoveragent.vercel.app/api/cron-source-refresh}"

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in GitHub repository secrets."
            exit 1
          fi

          echo "Calling ${endpoint}"
          http_code=$(curl -sS -o /tmp/cron-refresh-response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: discoveragent-github-actions-cron" \
            "${endpoint}")

          echo "HTTP ${http_code}"
          cat /tmp/cron-refresh-response.json
          echo

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "Cron refresh call failed."
            exit 1
          fi
