    const map = L.map('map').setView([56.1304, -106.3468], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const searchEl = document.getElementById('search');
    const summaryEl = document.getElementById('summary');
    const listEl = document.getElementById('list');
    const layer = L.layerGroup().addTo(map);
    const markers = new Map();
    let filtered = vendors.slice();
    const maxClaim = Math.max(...vendors.map(v => Number(String(v.claim_amount).replace(/,/g, '')) || 0));

    function money(v) {
      const n = Number(String(v).replace(/,/g, ''));
      if (Number.isNaN(n)) return v;
      return new Intl.NumberFormat('en-CA', {style:'currency', currency:'CAD'}).format(n);
    }

    function claimValue(v) {
      const n = Number(String(v).replace(/,/g, ''));
      return Number.isFinite(n) ? n : 0;
    }

    function markerRadius(amount) {
      const minR = 4;
      const maxR = 22;
      if (maxClaim <= 0) return minR;
      const t = Math.sqrt(amount / maxClaim);
      return minR + (maxR - minR) * t;
    }

    function markerColor(amount) {
      if (amount >= 500000) return '#8b0000';
      if (amount >= 200000) return '#c62828';
      if (amount >= 100000) return '#ef6c00';
      if (amount >= 50000) return '#f9a825';
      return '#1e88e5';
    }

    function render() {
      layer.clearLayers();
      markers.clear();
      listEl.innerHTML = '';
      let mapped = 0;
      const bounds = [];

      for (const v of filtered) {
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `<div class="name">${v.vendor_name}</div>
          <div class="meta">${v.address}</div>
          <div class="meta">Account: ${v.account_number || '-'}</div>
          <div class="amt">Claim: ${money(v.claim_amount)}</div>
          <div class="meta">${v.lat != null ? 'Mapped (' + v.coord_source + ')' : 'Not mapped'}</div>`;

        if (v.lat != null && v.lng != null) {
          mapped += 1;
          const amt = claimValue(v.claim_amount);
          const m = L.circleMarker([v.lat, v.lng], {
            radius: markerRadius(amt),
            color: markerColor(amt),
            fillColor: markerColor(amt),
            fillOpacity: 0.6,
            weight: 1
          }).addTo(layer);
          m.bindPopup(`<strong>${v.vendor_name}</strong><br>${v.address}<br>Claim: ${money(v.claim_amount)}`);
          markers.set(v.id, m);
          bounds.push([v.lat, v.lng]);
          item.addEventListener('click', () => {
            map.flyTo([v.lat, v.lng], 11, {duration:0.7});
            m.openPopup();
          });
        }

        listEl.appendChild(item);
      }

      summaryEl.textContent = `Showing ${filtered.length} / ${vendors.length} vendors. Mapped: ${mapped}.`;
      if (bounds.length) map.fitBounds(bounds, {padding:[20,20], maxZoom:11});
    }

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
      const div = L.DomUtil.create('div');
      div.style.background = '#fff';
      div.style.padding = '8px 10px';
      div.style.border = '1px solid #d9e3ef';
      div.style.borderRadius = '8px';
      div.style.fontSize = '12px';
      div.style.lineHeight = '1.4';
      div.innerHTML = `
        <div style="font-weight:700; margin-bottom:4px;">Claim Size</div>
        <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1e88e5;margin-right:6px;"></span>< 50k</div>
        <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#f9a825;margin-right:6px;"></span>50k-100k</div>
        <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#ef6c00;margin-right:6px;"></span>100k-200k</div>
        <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#c62828;margin-right:6px;"></span>200k-500k</div>
        <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#8b0000;margin-right:6px;"></span>>= 500k</div>
      `;
      return div;
    };
    legend.addTo(map);

    function applyFilter() {
      const q = searchEl.value.trim().toLowerCase();
      filtered = vendors.filter(v => !q || v.vendor_name.toLowerCase().includes(q) || v.address.toLowerCase().includes(q) || v.claim_amount.toLowerCase().includes(q));
      render();
    }

    searchEl.addEventListener('input', applyFilter);
    render();
  </script>
