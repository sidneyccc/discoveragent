<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Location Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Canadian Non-Bank Vendor Map</h1>
      <p>Data source: <code>canadian_non_bank_locations_reviewed.csv</code></p>
    </header>

    <main class="layout">
      <section class="panel controls">
        <h2>Controls</h2>

        <label class="field" for="searchInput">Search vendor/address</label>
        <input id="searchInput" type="text" placeholder="e.g. Toronto or Canada Royal Milk" />

        <div class="actions">
          <button id="geocodeBtn" type="button">Geocode Missing Locations</button>
          <button id="clearCacheBtn" type="button" class="secondary">Clear Geocode Cache</button>
        </div>

        <div class="note">
          Run with a local server, for example:
          <code>python3 -m http.server 4173</code>
        </div>

        <div class="summary" id="summary">Loading data...</div>
      </section>

      <section class="panel map-wrap">
        <div id="map" aria-label="Vendor locations map"></div>
      </section>

      <section class="panel list-wrap">
        <h2>Vendors</h2>
        <ul id="vendorList" class="vendor-list"></ul>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
