<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Location Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Canadian Non-Bank Vendor Map</h1>
      <p>Data source: <code>canadian_non_bank_locations_reviewed.csv</code></p>
    </header>

    <main class="layout">
      <section class="panel controls">
        <h2>Controls</h2>

        <label class="field" for="searchInput">Search vendor/address</label>
        <input id="searchInput" type="text" placeholder="e.g. Toronto or Canada Royal Milk" />

        <div class="field">Map style</div>
        <div class="toggle-group" id="markerStyleToggle" role="radiogroup" aria-label="Map marker style">
          <label class="toggle-option">
            <input type="radio" name="markerStyle" value="emphasis" checked />
            <span>Emphasized (by claim)</span>
          </label>
          <label class="toggle-option">
            <input type="radio" name="markerStyle" value="plain" />
            <span>Plain pins</span>
          </label>
        </div>

        <div class="actions">
          <button id="geocodeBtn" type="button">Geocode Missing Locations</button>
          <button id="clearCacheBtn" type="button" class="secondary">Clear Geocode Cache</button>
        </div>

        <section class="legend" id="markerLegend" aria-label="Map marker legend">
          <h3>Map Legend</h3>
          <div class="legend-row">
            <span class="legend-gradient" aria-hidden="true"></span>
            <span>Claim amount scale: blue (smaller) -> red (larger)</span>
          </div>
          <div class="legend-row">
            <span class="legend-dot legend-dot-approx"></span>
            <span>Lighter fill = approximate location (estimated from city/province, not exact address geocode)</span>
          </div>
        </section>

        <div class="summary" id="summary">Loading data...</div>
      </section>

      <section class="panel map-wrap">
        <div id="map" aria-label="Vendor locations map"></div>
      </section>

      <section class="panel list-wrap">
        <h2>Vendors</h2>
        <ul id="vendorList" class="vendor-list"></ul>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
